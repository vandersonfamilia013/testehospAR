<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Minimalista</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* Fundo animado suave */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #f7f7f7, #eaeaea, #f7f7f7);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Cabeçalho */
    header {
      padding: 1rem;
      background: white;
      width: 100%;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 600;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeInDown 1.2s ease forwards;
    }

    header img {
      height: 40px;
      width: 40px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    @keyframes fadeInDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Catálogo */
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 90%;
      max-width: 1200px;
      margin: 2rem auto;
    }

    .produto {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 1rem;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .produto:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    model-viewer {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      background: #eee;
    }

    h2 {
      margin: 1rem 0 0.5rem;
    }

    p {
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo"> 
    Realidade Aumentada - VANDERSON
  </header>

  <section class="catalogo">
    <!-- Produto 1 -->
    <div class="produto">
      <model-viewer src="modelos/painel001.glb" alt="Painel" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Painel de Televisão</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/mesa003.glb" alt="Mesa Moderna" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Mesa Moderna</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/mesaecadeiras001.glb" alt="Mesa de Café" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Mesa de Café</h2>
      <p>2</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/criadomudo001.glb" alt="Criado Mudo" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Criado Mudo</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/guardaroupas001.glb" alt="Guarda Roupas" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Guarda Roupas Moderno</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/guardaroupas002.glb" alt="Guarda Roupas Espelhado 2" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Guarda Roupas Espelhado 2</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/sofa.glb" alt="Sofá" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Sofá Cinza</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/CRISTALEIRA2.glb" alt="Cristaleira" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Cristaleira</h2>
      <p>1</p>
    </div>

    <div class="produto">
      <model-viewer src="modelos/sofa003.glb" alt="Sofá Vinho" ar camera-controls shadow-intensity="1" autoplay></model-viewer>
      <h2>Sofá Vinho</h2>
      <p>1</p>
    </div>
  </section>

  <script>
    // 🌤️ Define o ambiente HDR para todos os modelos
    const modelos = document.querySelectorAll("model-viewer");
    modelos.forEach(mv => {
      mv.setAttribute("environment-image", "modelos/environment.hdr");
    });
  </script>

</body>
</html>
