
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VAMEC - Realidade Aumentada</title>

  <!-- Biblioteca A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Biblioteca MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a124a;
      overflow: hidden;
    }

    .instrucoes {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      padding: 15px;
      background: rgba(26, 18, 74, 0.90);
      color: white;
      text-align: center;
      border-radius: 12px;
      z-index: 10;
      font-size: 15px;
    }

    .voltar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 25px;
      background: #32228a;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      z-index: 10;
      font-weight: bold;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="instrucoes">
    Aponte a câmera para o cartão VAMEC
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets (1).mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <a-asset-item
        id="sofa"
        src="./modelos/criadomudo001.glb">
      </a-asset-item>
    </a-assets>

    <!-- Câmera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagem rastreada -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Modelo 3D -->
      <a-gltf-model
        src="#sofa"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <a href="index.html" class="voltar">
    Voltar ao catálogo
  </a>

</body>
</html>
